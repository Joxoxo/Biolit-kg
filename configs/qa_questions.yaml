# M6 问答评估题库（30 题，5 类 × 6 题）
# source：用户 = 项目作者凭药学经验出题（未看图谱数据）；图谱 = 从知识图谱中挑选补充
# scope：in = 语料中有相关文献；out = 语料中查不到（测试系统是否会拒答，而不是用自身知识编造）
#
# filters 只用来生成"候选证据"供人工审核，不参与系统回答。每个 filter 块内各字段是"且"，多个块之间是"或"。
#   subject / object / comparator：关系字段的子串匹配（任一命中即可）
#   relation：关系类型
#   population：人群描述的子串匹配
#   swap: comparator → 主体和对照药互换也算（A 比 B 和 B 比 A 是同一件事）
#   swap: object     → 主体和客体互换也算（用于相互作用：A 与 B 相互作用 = B 与 A 相互作用）
# keywords：摘要中必须同时出现的词，用于补充"抽取漏掉但文献其实相关"的候选，降低只依赖抽取结果带来的偏差

- id: Q01
  category: 药物比较
  source: 用户
  scope: in
  question: 房颤患者用阿哌沙班和华法林，哪种药的大出血风险更低？颅内出血风险呢？
  filters:
    - {subject: [apixaban], comparator: [warfarin, vitamin k antagonist], object: [major bleeding, intracranial], swap: comparator}
  keywords: [apixaban, warfarin, intracranial]

- id: Q02
  category: 药物比较
  source: 用户
  scope: in
  question: 阿哌沙班和利伐沙班直接比较时，消化道出血和缺血性卒中的风险有没有差别？
  filters:
    - {subject: [apixaban], comparator: [rivaroxaban], object: [gastrointestinal, ischemic stroke], swap: comparator}
  keywords: [apixaban, rivaroxaban, gastrointestinal]

- id: Q03
  category: 相互作用与药代
  source: 用户
  scope: in
  question: 华法林和氟康唑合用，为什么可能增加出血风险？这和 CYP2C9 抑制有关系吗？
  filters:
    - {subject: [fluconazole], object: [warfarin, cyp2c9], swap: object}
  keywords: [warfarin, fluconazole]

- id: Q04
  category: 相互作用与药代
  source: 用户
  scope: in
  question: 利伐沙班与胺碘酮合用时，出血风险会不会升高？摘要里有没有提到 P-gp 或 CYP3A4 相关的机制？
  filters:
    - {subject: [amiodarone, antiarrhythmic], object: [rivaroxaban, doac, factor xa], swap: object}
    - {subject: [amiodarone, antiarrhythmic], relation: [increases_risk]}
  keywords: [rivaroxaban, amiodarone]

- id: Q05
  category: 特殊人群
  source: 用户
  scope: in
  question: 老年房颤患者合并肾功能不全时，DOAC 和华法林相比，大出血与卒中风险分别怎么样？
  filters:
    - {subject: [doac, apixaban, rivaroxaban, dabigatran, edoxaban], comparator: [warfarin, vitamin k antagonist], population: [renal, kidney, ckd], swap: comparator}
  keywords: [renal, warfarin, elderly]

- id: Q06
  category: 特殊人群
  source: 用户
  scope: in
  question: 正在接受透析的房颤患者，使用阿哌沙班或华法林时，出血、卒中和死亡风险有什么差异？
  filters:
    - {subject: [apixaban], comparator: [warfarin, vitamin k antagonist], population: [dialysis, end-stage, eskd, esrd], swap: comparator}
  keywords: [apixaban, dialysis]

- id: Q07
  category: 汇总
  source: 用户
  scope: in
  question: 不同 DOAC 的消化道出血风险一样吗？阿哌沙班、利伐沙班和达比加群之间有什么差别？
  filters:
    - {subject: [apixaban, rivaroxaban, dabigatran, edoxaban], comparator: [apixaban, rivaroxaban, dabigatran, edoxaban], object: [gastrointestinal]}
  keywords: [gastrointestinal, dabigatran, rivaroxaban, apixaban]

- id: Q08
  category: 汇总
  source: 用户
  scope: in
  question: DOAC 相比华法林是否都能降低颅内出血风险？这种获益在不同 DOAC 之间一致吗？
  filters:
    - {subject: [doac, apixaban, rivaroxaban, dabigatran, edoxaban], comparator: [warfarin, vitamin k antagonist], object: [intracranial], swap: comparator}
  keywords: [intracranial, warfarin]

- id: Q09
  category: 药物比较
  source: 用户
  scope: in
  question: 肝素和阿哌沙班相比，哪种药的出血风险更低？
  note: 原为范围外题，查库发现有阿哌沙班对比低分子肝素的文献，改为正常题
  filters:
    - {subject: [apixaban], comparator: [heparin, dalteparin, enoxaparin, lmwh], swap: comparator}
  keywords: [apixaban, heparin, bleeding]

- id: Q10
  category: 药物比较
  source: 用户
  scope: in
  question: 阿司匹林单药和氯吡格雷单药相比，哪种药引起的消化道出血更少？
  note: 原为范围外题，查库发现有相关文献，改为正常题
  filters:
    - {subject: [clopidogrel], comparator: [aspirin], object: [bleeding], swap: comparator}
  keywords: [clopidogrel, aspirin monotherapy]

- id: Q11
  category: 药物比较
  source: 图谱
  scope: in
