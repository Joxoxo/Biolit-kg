# 数据源配置：抗凝 / 抗血栓药物的不良反应与相互作用（PubMed 文献）
source: pubmed
max_papers: 1000

# 药物范围：抗凝药 + 抗血小板药
drugs:
  - warfarin
  - apixaban
  - rivaroxaban
  - dabigatran
  - edoxaban
  - heparin
  - enoxaparin
  - clopidogrel
  - ticagrelor
  - aspirin

# 关注的问题：不良反应、药物相互作用、药物代谢
topics:
  - adverse effects
  - drug interactions
  - bleeding
  - pharmacokinetics
  - CYP2C9
  - CYP3A4

# 检索式 = (任一药物) AND (任一主题)，并只保留近 10 年、有摘要的英文文献
years: 10
