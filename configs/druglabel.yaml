# M3 说明书交叉验证：从 openFDA 下载的药品说明书
# brand：优先选原研药的说明书（仿制药说明书内容基本一致，但更新可能滞后）
#        华法林原研 Coumadin 已在美国停产，留空表示选最新的一份
drugs:
  apixaban: Eliquis
  rivaroxaban: Xarelto
  dabigatran: Pradaxa
  edoxaban: Savaysa
  warfarin: ""
  clopidogrel: Plavix
  ticagrelor: Brilinta

# 保留的说明书章节（openFDA 字段名）
sections:
  - boxed_warning              # 黑框警告
  - contraindications          # 禁忌
  - warnings_and_cautions      # 警告与注意事项
  - adverse_reactions          # 不良反应
  - drug_interactions          # 药物相互作用
  - use_in_specific_populations  # 特殊人群
  - clinical_pharmacology      # 临床药理（含代谢酶、转运体信息）
